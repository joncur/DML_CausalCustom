[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dml-causalcustom"
version = "0.2.0"
description = "Cross-fitted causal R-learner with a coupled LightGBM residual objective"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2", "lightgbm>=4.3,<5",
]

[project.optional-dependencies]
pipeline = ["joblib>=1.3,<2", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10", "joblib>=1.3,<2", "matplotlib>=3.8,<4"]

[tool.setuptools]
py-modules = ["causal_dml"]
